[package]
name = "fooit"
version = "0.1.0"
edition = "2024"
description = "A terminal todo manager"

[dependencies]
chrono = "0.4"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.28"
dirs = "5"
libc = "0.2"
ratatui = "0.29"
regex = "1"
signal-hook = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
unicode-width = "0.2"
getrandom = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chacha20poly1305 = "0.11.0"
hkdf = "0.13.0"
sha2 = "0.11.1"
base64 = "0.23.1"
toml = "1.1.8"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tiny_http = "0.12.0"
