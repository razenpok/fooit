[package]
name = "fooit"
version = "0.1.0"
edition = "2024"
description = "A terminal todo manager that shares dooit's database"

[dependencies]
chrono = "0.4"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.28"
dirs = "5"
ratatui = "0.29"
regex = "1"
signal-hook = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
unicode-width = "0.2"
