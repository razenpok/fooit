name = "fooit-sync"
main = "src/index.js"
compatibility_date = "2025-09-01"

# one Durable Object per log, keeping its base and batches in its own SQLite storage
[[durable_objects.bindings]]
name = "LOGS"
class_name = "Log"

# one more for pairing codes, which hand a share link to another machine
[[durable_objects.bindings]]
name = "PAIRING"
class_name = "Pairing"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Log"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Pairing"]

# The token that lets a machine start new logs. Set it with
#   npx wrangler secret put OWNER_TOKEN
# and, for `wrangler dev`, in a .dev.vars file as OWNER_TOKEN="..."
